<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecionando...</title>
    <script>
        // Redireciona todas as rotas para index.html no GitHub Pages
        const path = window.location.pathname.replace('/reposto/', '');
        if (path && path !== '404.html') {
            window.location.href = '/reposto/?redirect=' + encodeURIComponent(path);
        } else {
            window.location.href = '/reposto/';
        }
    </script>
</head>
<body>
    <p>Redirecionando...</p>
</body>
</html>
